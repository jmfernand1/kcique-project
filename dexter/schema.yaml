  /dexter/api/ejecuciones/:
    get:
      operationId: ejecuciones_list
      description: |-
        API para gestionar ejecuciones del ETL.

        Endpoints:
        - GET /api/ejecuciones/ - Listar todas las ejecuciones
        - POST /api/ejecuciones/ - Crear nueva ejecución
        - GET /api/ejecuciones/{id}/ - Obtener una ejecución
        - PATCH /api/ejecuciones/{id}/ - Actualizar ejecución
        - GET /api/ejecuciones/pendientes/ - Obtener ejecuciones pendientes
        - POST /api/ejecuciones/{id}/completar/ - Marcar como completada
        - POST /api/ejecuciones/{id}/fallar/ - Marcar como fallida
        - GET /api/ejecuciones/{id}/progreso/ - Obtener progreso detallado
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - COMPLETADO
          - EN_PROGRESO
          - FALLIDO
          - INICIADO
          - PAUSADO
        description: |-
          * `INICIADO` - Iniciado
          * `EN_PROGRESO` - En Progreso
          * `COMPLETADO` - Completado
          * `FALLIDO` - Fallido
          * `PAUSADO` - Pausado
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: tipo_proceso
        schema:
          type: string
          enum:
          - DESEMBOLSO
          - GARANTIA
        description: |-
          * `DESEMBOLSO` - Proceso de Desembolso
          * `GARANTIA` - Proceso de Garantía
      tags:
      - ejecuciones
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEjecucionETLList'
          description: ''
    post:
      operationId: ejecuciones_create
      description: |-
        API para gestionar ejecuciones del ETL.

        Endpoints:
        - GET /api/ejecuciones/ - Listar todas las ejecuciones

openapi: 3.0.3
info:
  title: API Dexter - KCIQUE
  version: 1.0.0
  description: 'API REST de la app Dexter: ETL de Desembolsos y Garantías, y tracking
    de procesos/etapas. Permite a un desarrollador externo consumir o entregar información
    a la integración.'
paths:
  /dexter/api/cargos-fijos/:
    get:
      operationId: cargos_fijos_list
      description: |-
        ViewSet para gestionar Cargos Fijos.

        Endpoints disponibles:
        - GET /api/cargos-fijos/ - Listar todos los cargos fijos
        - POST /api/cargos-fijos/ - Crear un nuevo cargo fijo
        - GET /api/cargos-fijos/{id}/ - Obtener un cargo fijo específico
        - PUT /api/cargos-fijos/{id}/ - Actualizar un cargo fijo completo
        - PATCH /api/cargos-fijos/{id}/ - Actualizar parcialmente un cargo fijo
        - DELETE /api/cargos-fijos/{id}/ - Eliminar un cargo fijo
      parameters:
      - in: query
        name: codigo
        schema:
          type: string
      - in: query
        name: desembolso
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: periodicidad
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - cargos-fijos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCargoFijoList'
          description: ''
    post:
      operationId: cargos_fijos_create
      description: |-
        ViewSet para gestionar Cargos Fijos.

        Endpoints disponibles:
        - GET /api/cargos-fijos/ - Listar todos los cargos fijos
        - POST /api/cargos-fijos/ - Crear un nuevo cargo fijo
        - GET /api/cargos-fijos/{id}/ - Obtener un cargo fijo específico
        - PUT /api/cargos-fijos/{id}/ - Actualizar un cargo fijo completo
        - PATCH /api/cargos-fijos/{id}/ - Actualizar parcialmente un cargo fijo
        - DELETE /api/cargos-fijos/{id}/ - Eliminar un cargo fijo
      tags:
